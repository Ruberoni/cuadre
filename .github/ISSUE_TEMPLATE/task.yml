name: Task (agent-ready spec)
description: A unit of work an agent can implement end to end. The maintainer adds the `agent-ready` label once the spec is complete.
title: "<verb> <what>"
labels: ["needs-triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters. Link related issues, ADRs and glossary terms.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete Given/When/Then examples with real numbers. These become tests.
      placeholder: |
        - Given an invoice of 100.00 USD
          When it is paid in full in USD cash
          Then the payment records IGTF of 3.00 USD and the outstanding balance is 0.00 USD
    validations:
      required: true
  - type: dropdown
    id: modules
    attributes:
      label: Affected modules
      multiple: true
      options:
        - catalog
        - partners
        - purchasing
        - inventory
        - sales
        - billing
        - exchange-rates
        - web (apps/web, including tokens and shadcn components)
        - infra / tooling
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue must NOT do.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test expectations
      description: Unit (domain), integration (use case vs Postgres), E2E — which apply.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design handoff
      description: >-
        Artboard link, completed review checklist and trimmed handoff, using the template in docs/design/README.md (ADR-012).
        Write "N/A — no UI" if the issue adds or changes no screen.
        A UI issue with an incomplete checklist gets `needs-design` and cannot be `agent-ready`.
      placeholder: |
        **Artboard:** https://claude.ai/artifact/…

        - [ ] ux-copy
        - [ ] design-critique
        - [ ] accessibility-review
        - [ ] design-handoff

        (components and states, empty/loading/error, copy, focus and keyboard, accepted 🟡 findings)
    validations:
      required: true
