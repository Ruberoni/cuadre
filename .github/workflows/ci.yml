name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  static:
    name: static (typecheck, lint, boundaries, knip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Biome
        run: pnpm exec biome ci .
      - name: Module boundaries
        run: pnpm lint:boundaries
      - name: Dead code (Knip)
        run: pnpm lint:knip
      - name: Route tree is up to date
        run: |
          pnpm --filter @cuadre/web exec tsr generate
          git diff --exit-code -- apps/web/src/routeTree.gen.ts

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration:
    name: integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cuadre
          POSTGRES_PASSWORD: cuadre
          POSTGRES_DB: cuadre_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cuadre -d cuadre_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://cuadre:cuadre@localhost:5433/cuadre_test
      DATABASE_URL_TEST: postgres://cuadre:cuadre@localhost:5433/cuadre_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate
        run: pnpm db:migrate
      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: verify and E2E (boot the app, smoke, acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # verify reuses a Postgres that already answers on 5433 instead of starting docker compose.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cuadre
          POSTGRES_PASSWORD: cuadre
          POSTGRES_DB: cuadre
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cuadre -d cuadre"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @cuadre/web exec playwright install --with-deps chromium
      - name: Verify (migrate, seed, boot api + web, smoke E2E)
        run: pnpm verify
      - name: Acceptance E2E and browser component tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
