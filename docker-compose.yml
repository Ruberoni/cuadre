services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cuadre
      POSTGRES_PASSWORD: cuadre
      POSTGRES_DB: cuadre
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cuadre -d cuadre"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
